<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Лабораторна робота №2</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table class="layout">
      <tr class="row-1">
        <td colspan="3">
          <div class="cell-text">Кривець</div>
        </td>

        <td colspan="2" class="split-top">
          <div class="cell-zone top">Анастасія</div>
          <div class="cell-zone bottom">Олександрівна</div>
        </td>

        <td class="split-left">
          <div class="cell-zone left">ІП-з31</div>
          <div class="cell-zone right">Варіант 11</div>
        </td>
      </tr>

      <tr class="row-2">
        <td colspan="2"></td>
        <td rowspan="2"></td>
        <td rowspan="2" colspan="2"></td>
        <td rowspan="2"></td>
      </tr>

      <tr>
        <td colspan="2"></td>
      </tr>
    </table>

    <div class="traffic-light">
      <div class="lamp red"></div>
      <div class="lamp yellow"></div>
      <div class="lamp green"></div>
    </div>
  </body>
</html>
